[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivaer-surrogate"
version = "0.1.0"
description = "Surface pressure (Cp) surrogate for DrivAerML cars, and the Cp Predictor browser tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lightgbm>=4.5",
    "numpy>=2.0",
    "pyvista>=0.44",
    "scipy>=1.14",
    "torch>=2.5",
]

[project.scripts]
surrogate = "surrogate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/surrogate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# σ, − and × in strings and docstrings are notation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
venvPath = "."
venv = ".venv"
